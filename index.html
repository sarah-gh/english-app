<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/english-app/favicon.ico">
    <link rel="apple-touch-icon" href="/english-app/pwa-192x192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Offline-first smart flashcard app for learning English vocabulary and grammar.">
    <title>Flashcards</title>
    <script type="text/javascript">
      // Applied inline, before any CSS/JS module loads, so a dark-mode user never sees a flash of
      // the light theme on first paint — `src/main.ts` re-applies the same logic once Vue boots,
      // this is purely about beating the very first paint.
      (function () {
        try {
          var stored = localStorage.getItem('theme-mode');
          var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/english-app/assets/index-DRR8I5FU.js"></script>
    <link rel="stylesheet" crossorigin href="/english-app/assets/index-ClEk2Avt.css">
  <link rel="manifest" href="/english-app/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/english-app/registerSW.js"></script></head>
  <body>
    <script type="text/javascript">
      // Restores the original deep-link path encoded by 404.html
      // (see https://github.com/rafgraph/spa-github-pages).
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <div id="app"></div>
  </body>
</html>
